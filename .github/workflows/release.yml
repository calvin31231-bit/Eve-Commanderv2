name: Release

# Builds signed-ready desktop bundles for macOS, Windows, and Linux when a
# version tag (v*) is pushed, and drafts a GitHub release with the artifacts.
#
# Code-signing / notarization are opt-in: supply the secrets below and the
# bundler picks them up automatically. Without them the build still produces
# working (unsigned) installers — they just trip SmartScreen/Gatekeeper, so
# signing is recommended before a public 1.0. See docs for the key list:
#   - Apple:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#              APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   - Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
#   - Updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.1)"
        required: true
        default: v0.1.1

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the backend binary at compile time (public PKCE id, not a
          # secret — see BAKED_CLIENT_ID in src-tauri/src/lib.rs). Set the repo
          # secret so public builds authenticate without an end-user .env.
          EVE_COMMANDER_CLIENT_ID: ${{ secrets.EVE_COMMANDER_CLIENT_ID }}
          # Optional signing — present only if the corresponding secrets are set.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # On a tag push, github.ref_name is the tag; on a manual dispatch it's
          # the branch, so fall back to the `tag` input (which tauri-action
          # creates on the checked-out commit).
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "EVE Commander ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false
