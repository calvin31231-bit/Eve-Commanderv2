name: CI

# The verification gate that every feature is held to during development, run
# on every push and PR so regressions surface before merge: the Rust test
# suite (unit + golden values) with zero-warning clippy, and the TypeScript
# typecheck + frontend build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 needs the system WebKit/GTK libraries to link src-tauri.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev

      - name: Install Rust toolchain (pinned to MSRV)
        uses: dtolnay/rust-toolchain@1.80
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets

      - name: Test (unit + golden values)
        run: cargo test --workspace

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
