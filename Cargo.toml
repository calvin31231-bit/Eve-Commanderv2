[workspace]
members = ["crates/eve-core", "crates/sde-tools", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["EVE Commander contributors"]
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
# Synchronous SQLite for the cache store, which sits on the ESI client's hot
# synchronous path (the CacheStore trait is sync). Shares libsqlite3-sys with sqlx.
rusqlite = { version = "0.32", features = ["bundled"] }
