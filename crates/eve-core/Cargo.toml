[package]
name = "eve-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Core logic for EVE Commander: ESI client, SSO/PKCE auth, SDE access, scheduler, and domain models. No GUI dependencies."

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
sha2.workspace = true
base64.workspace = true
rand.workspace = true
time.workspace = true
tracing.workspace = true
sqlx.workspace = true
rusqlite.workspace = true

[features]
default = []
# Token storage in the OS keychain. Optional because the secret-service backend
# is not always available in headless/CI environments.
keychain = ["dep:keyring"]

[dependencies.keyring]
version = "3"
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
